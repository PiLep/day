name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/day"
  AUTH_SECRET: "ci-secret-not-for-production"
  AUTH_GOOGLE_ID: "placeholder"
  AUTH_GOOGLE_SECRET: "placeholder"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 1
          include-hidden-files: true

  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  security:
    name: Sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Audit des dépendances (prod, vulnérabilités high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Scan des secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo -v --redact

  e2e:
    name: Tests e2e
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: day
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/
      - run: npx prisma generate
      - name: Appliquer les migrations
        run: npx prisma migrate deploy
      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy (production)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, test, security, e2e]
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Deploy vers Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::Secret VERCEL_TOKEN absent — déploiement ignoré."
            echo "Configurez VERCEL_TOKEN, VERCEL_ORG_ID et VERCEL_PROJECT_ID dans les secrets du dépôt."
            exit 0
          fi
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

          # Applique les migrations Prisma sur la base de production.
          # L'URL vient des variables d'environnement Vercel ; selon le
          # produit Storage choisi (Neon, Supabase, Prisma Postgres…) elle
          # n'est pas toujours nommée DATABASE_URL, donc on cherche parmi
          # les noms usuels.
          npm ci
          unset DATABASE_URL
          set -a; . .vercel/.env.production.local; set +a
          RESOLVED=""
          for candidate in "$DATABASE_URL" "$DATABASE_URL_UNPOOLED" "$POSTGRES_PRISMA_URL" "$POSTGRES_URL" "$POSTGRES_URL_NON_POOLING"; do
            case "$candidate" in
              postgres://*|postgresql://*|prisma+postgres://*) RESOLVED="$candidate"; break ;;
            esac
          done
          if [ -z "$RESOLVED" ]; then
            echo "::error::Aucune URL Postgres trouvée dans l'environnement Vercel (production)."
            echo "Protocole de DATABASE_URL reçue : '${DATABASE_URL%%://*}' (attendu : postgresql, postgres ou prisma+postgres)."
            echo "Créez une base dans Vercel → Storage (Neon recommandé) sur l'environnement Production, ou définissez DATABASE_URL manuellement."
            exit 1
          fi
          export DATABASE_URL="$RESOLVED"
          echo "URL Postgres résolue (protocole : ${DATABASE_URL%%://*}://…)"
          npx prisma migrate deploy

          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
